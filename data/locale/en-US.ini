Issue.CameraOffline.Title="Camera offline: %s"
Issue.CameraOffline.Cause="Nothing is publishing to \"%s\" on %s. Check that the camera app is streaming, and to this stream name (the CTD Hub can copy its publish URL)."
Issue.CameraOffline.Action="Copy the camera's SRT publish URL"
Issue.UpstreamLoss.Title="Upstream packet loss on %s (%.1f%%)"
Issue.UpstreamLoss.Cause="The camera's link to the server is losing packets. Raise the camera's SRT latency to at least %d ms (4 × its %.0f ms round trip), or lower its bitrate."
Issue.UpstreamSlow.Title="Upstream link slow on %s"
Issue.UpstreamSlow.Cause="The round trip to the camera is %.0f ms. Lower the camera's bitrate, or move it to a better connection."
Issue.BitrateCollapsed.Title="Bitrate collapsed on %s"
Issue.BitrateCollapsed.Cause="The camera sends %.0f kbps, down from about %.0f. A struggling connection, or the camera app throttling."
Issue.FrequentSnaps.Title="Frequent snaps on %s"
Issue.FrequentSnaps.Cause="It snapped to the live edge %zu times in 5 minutes: the feed keeps arriving late. Raise this source's SRT latency or its drift cap."
Issue.FrequentSnaps.Action="Raise this source's SRT latency to %d ms (from %d)"
Issue.AvDrift.Title="Sender clock drifting on %s"
Issue.AvDrift.Cause="Soft correction has been at its limit for 30 s: the camera's clock runs far off. The picture still snaps back if it drifts past the cap."
Issue.AudioRate.Title="Audio at %g kHz on %s"
Issue.AudioRate.Cause="The camera sends %g kHz audio, often a Bluetooth microphone on a phone. The plugin converts it to 48 kHz, so it plays correctly; for better sound use a wired or built-in mic."
Issue.AudioMissing.Title="No audio on %s"
Issue.AudioMissing.Cause="The stream has no audio track. Check the camera app's audio setting."
Issue.AudioSilent.Title="Audio silent on %s"
Issue.AudioSilent.Cause="No sound above -60 dBFS for 10 s. Check the camera's microphone: muted, unplugged, or the wrong input selected in the camera app."
Issue.AudioClipping.Title="Audio clipping on %s"
Issue.AudioClipping.Cause="%.1f%% of the samples hit full scale: the sound distorts. The gain is set too high upstream (the mic or the camera app); turning it down in CTD OBS won't undo the distortion."
Issue.ChannelDead.Title="One audio channel dead on %s"
Issue.ChannelDead.CauseLeft="The left channel is %.0f dB below the other: a mono mic on one side of a stereo input, or a bad cable. Putting the live channel on both sides fixes it."
Issue.ChannelDead.CauseRight="The right channel is %.0f dB below the other: a mono mic on one side of a stereo input, or a bad cable. Putting the live channel on both sides fixes it."
Issue.ChannelDead.ActionLeft="Use the left channel on both sides"
Issue.ChannelDead.ActionRight="Use the right channel on both sides"
Issue.TimecodeOnProgram.Title="Timecode on a program channel of %s"
Issue.TimecodeOnProgram.CauseLeft="The left channel carries LTC timecode: a loud buzz in the program audio. Using it as the timecode input takes it out of the mix (the other channel plays on both sides) and lets the feed join a sync group."
Issue.TimecodeOnProgram.CauseRight="The right channel carries LTC timecode: a loud buzz in the program audio. Using it as the timecode input takes it out of the mix (the other channel plays on both sides) and lets the feed join a sync group."
Issue.TimecodeOnProgram.CauseChannel="Channel %d carries LTC timecode: a loud buzz in the program audio. Using it as the timecode input takes it out of the mix and lets the feed join a sync group."
Issue.TimecodeOnProgram.ActionLeft="Use the left channel as timecode"
Issue.TimecodeOnProgram.ActionRight="Use the right channel as timecode"
Issue.TimecodeOnProgram.ActionChannel="Use channel %d as timecode"
Issue.SyncLost.Title="Sync lost on %s (group \"%s\")"
Issue.SyncLost.CauseFreewheel="Its timecode stopped: the LTC cable or box, or the feed itself. It holds its last delay, so it stays close, and relocks without a jump when timecode returns."
Issue.SyncLost.CauseAtMax="It would need %.0f ms of delay to line up, more than the group's max. It is held at the max; raise the group's max delay (up to 5000 ms) if that much is expected."
Issue.FrozenPicture.Title="Frozen picture on %s"
Issue.FrozenPicture.Cause="Frames keep arriving but the picture hasn't changed for %ld s: the camera app is stuck. Kicking the publisher makes it reconnect."
Issue.FrozenPicture.Action="Kick the publisher so the camera reconnects"
Issue.LowFps.Title="Low frame rate on %s (%.1f of %.0f fps)"
Issue.LowFps.Cause="Frames are missing on the way: a weak connection or a struggling camera. Lowering the camera's bitrate or resolution usually helps."
Issue.DecoderBehind.Title="Decoder falling behind on %s"
Issue.DecoderBehind.CauseCpu="Each frame takes %.1f ms to decode, longer than the %.1f ms it lasts. Decoding on the graphics card takes the load off the CPU."
Issue.DecoderBehind.CauseOverloaded="Each frame takes %.1f ms to decode, longer than the %.1f ms it lasts. The machine is overloaded: close other work, or lower the feed's resolution."
Issue.DecoderBehind.Action="Decode on the graphics card (Auto)"
Issue.Fix.Cause="A fix that was applied. Undo puts the setting back."
Issue.Fix.Latency="Raised %s's SRT latency to %lld ms (was %lld)"
Issue.Fix.LatencyUndo="Set it back to %lld ms"
Issue.Fix.HardwareDecode="%s now decodes on the graphics card (Auto)"
Issue.Fix.HardwareDecodeUndo="Back to decoding on the CPU"
Issue.Fix.ChannelsLeft="%s now plays its left channel on both sides"
Issue.Fix.ChannelsRight="%s now plays its right channel on both sides"
Issue.Fix.ChannelsUndo="Back to stereo as sent"
Issue.Fix.Timecode="%s now reads timecode from channel %lld, out of the program audio"
Issue.Fix.TimecodeUndo="Back to no timecode input"
