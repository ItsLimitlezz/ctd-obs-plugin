<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTD Sync Clip</title>
<style>
  /* SPEC S16: the sync clip. A white flash and a 1 kHz beep at the same moment, once a second, for the source's sync
     check. Show it full screen on a phone (or any screen) in front of the camera, with the sound up. */
  /* The CTD brand's Night theme. The flash stays pure white: the check measures it. */
  @font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk-Bold.ttf"); font-weight: 700; }
  :root { --void: #04070c; --grid: #0b1821; --ink: #f2fbff; --ink-body: #b9c6ce; --ink-muted: #8ba3af;
    --cyan: #39e7ff; --magenta: #ff00b8; --on-accent: #04070c; --flash: #fff;
    --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
    --heading: "Space Grotesk", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink-body);
    font: 13px/20px var(--mono); overflow: hidden; }
  body { background-image: linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 48px 48px; }
  #flash { position: fixed; inset: 0; background: var(--flash); opacity: 0; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
    gap: 16px; padding: 16px; max-width: 560px; margin: 0 auto; cursor: pointer; }
  .eyebrow { color: var(--cyan); font-size: 10px; line-height: 14px; letter-spacing: 0.24em; text-transform: uppercase; }
  h1 { margin: 0; color: var(--ink); font: 700 clamp(30px, 8vw, 52px)/0.95 var(--heading); text-transform: uppercase; }
  h1 span { color: var(--magenta); }
  .go { align-self: flex-start; margin-top: 8px; padding: 12px 18px; background: var(--cyan); color: var(--on-accent);
    font: 700 11px/14px var(--mono); letter-spacing: 0.3em; text-transform: uppercase;
    box-shadow: 5px 5px 0 0 var(--magenta); }
  #count { position: fixed; bottom: 16px; left: 16px; color: var(--ink-muted); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="start">
  <div class="eyebrow">CTD // Sync check</div>
  <h1>Flash. Beep. <span>Lock it in.</span></h1>
  <div>Turn the sound up and hold this screen in front of the camera. Then press Start the sync check in the source's
    properties. It watches and listens for 10 s.</div>
  <div class="go">Tap to start →</div>
</div>
<div id="count"></div>
<script>
  /* The beep is scheduled on the audio clock and the flash follows the same clock, corrected for the audio output's
     latency where the browser reports it, so both leave the phone together. */
  const flash = document.getElementById('flash');
  const count = document.getElementById('count');
  let audio = null, next = 0, n = 0;

  function beepAt(when) {
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.8, when);
    gain.gain.setValueAtTime(0, when + 0.05);
    osc.connect(gain).connect(audio.destination);
    osc.start(when);
    osc.stop(when + 0.06);
  }

  /* the beeps run on a timer, half a second ahead, so they keep going even when the page isn't drawing */
  function schedule() {
    if (next < audio.currentTime) next = Math.ceil(audio.currentTime);
    while (next < audio.currentTime + 0.5) { beepAt(next); next += 1; }
  }

  function frame() {
    const latency = (audio.outputLatency || 0) + (audio.baseLatency || 0);
    const heard = audio.currentTime - latency; /* what is coming out of the speaker now */
    const sinceBeat = heard - Math.floor(heard);
    flash.style.opacity = heard > 0 && sinceBeat < 0.05 ? '1' : '0';
    const beat = Math.floor(heard);
    if (beat !== n && heard > 0) { n = beat; count.textContent = 'BEAT ' + String(n % 100).padStart(2, '0') + ' · 1 KHZ · FLASH'; }
    requestAnimationFrame(frame);
  }

  document.getElementById('start').addEventListener('click', async () => {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    await audio.resume();
    next = Math.ceil(audio.currentTime) + 1;
    document.getElementById('start').remove();
    if (document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(() => {});
    schedule();
    setInterval(schedule, 200);
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
