name: macOS smoke probe (temporary, issue 30)
on:
  push:
    branches: [mid/macos-ci-probe]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: probe ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: srgb-26, os: macos-26, srgb: '1' }
          - { name: info-26, os: macos-26, srgb: '' }
          - { name: plugin-14, os: macos-14, srgb: '' }
          - { name: plugin-15-intel, os: macos-15-intel, srgb: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ctd-live-source-0.1.0-macos-universal-bbf174bab
          path: ${{ runner.temp }}/plugin
          run-id: 42745575547
          github-token: ${{ github.token }}
      - name: Probe
        run: |
          sw_vers
          ls -laR /Library/ColorSync/Profiles/Displays 2>&1 || true
          for f in /Library/ColorSync/Profiles/Displays/*/* /Library/ColorSync/Profiles/Displays/*; do [ -f "$f" ] && { echo "== $f"; strings -n 6 "$f" | head -20; }; done || true
          swift test/macos/display-srgb.swift ${{ matrix.srgb == '1' && '--set' || '' }} || echo "swift failed $?"
          bash test/macos-smoke.sh "$(find "${{ runner.temp }}/plugin" -type f | head -n 1)" || true
          echo '--- obs-stdout tail'; tail -n 20 test/out/macos/obs-stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: test/out/macos/
